{% extends "base.html" %}
{% block title %}Log In - Verdant{% endblock %}
{% block content %}
    <span class="eyebrow">// WELCOME BACK</span>
    <h1>Log in</h1>

    {% if error %}
        <p class="status status-warning">{{ error }}</p>
    {% endif %}

    <form action="/login" method="post" class="plant-form">
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn">Log In</button>
    </form>

    <p>New here? <a href="/signup">Create an account</a></p>
{% endblock %}
